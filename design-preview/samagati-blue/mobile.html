<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Samagati · Mobile preview</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#edf1f7;color:#26354b;overflow:hidden}.toolbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:#fff;border-bottom:1px solid #dfe6f0;gap:20px}.title strong{display:block;font-size:17px}.title small{display:block;color:#8591a2;margin-top:5px}.tabs{display:flex;gap:6px;background:#f2f5fa;padding:5px;border-radius:12px}button{font:inherit;cursor:pointer;border:0;background:transparent;border-radius:8px;padding:10px 18px;color:#687b96}button.active{background:#2469de;color:white}.stage{height:calc(100dvh - 112px);display:flex;align-items:center;justify-content:center}.phone-wrap{position:relative;flex-shrink:0}.phone{width:410px;height:852px;border:9px solid #263142;border-radius:44px;background:#fff;overflow:hidden;box-shadow:0 22px 65px #243e6924;transform-origin:top left;position:absolute;left:0;top:0}.status{height:29px;padding:7px 20px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:700;background:#fff;color:#25324a}.speaker{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:80px;height:6px;border-radius:8px;background:#263142}iframe{display:block;width:392px;height:805px;border:0;background:#f5f7fb}.note{text-align:center;color:#8190a6;font-size:12px;height:36px;padding:8px}.open{color:#2469de;text-decoration:none;font-size:12px;white-space:nowrap}@media(max-width:650px){.toolbar{height:106px;padding:14px 16px;flex-wrap:wrap;justify-content:center;gap:10px}.title{display:none}.open{font-size:11px}.stage{height:calc(100dvh - 140px)}.tabs button{padding:9px 14px}.note{font-size:10px}}</style></head><body><header class="toolbar"><div class="title"><strong>Samagati Hospital</strong><small>Blue concept · Interactive mobile preview</small></div><nav class="tabs"><button class="active" data-route="patient/home">Patient</button><button data-route="doctor/home">Doctor</button><button data-route="login">Login</button></nav><a class="open" href="/" target="_blank" rel="noopener">Open full page ↗</a></header><main class="stage"><div class="phone-wrap"><div class="phone"><div class="status"><span>9:41</span><span>▮▮▮ &nbsp; Wi-Fi &nbsp; ▰</span></div><div class="speaker"></div><iframe title="Interactive hospital mobile app" src="/#patient/home"></iframe></div></div></main><footer class="note">Scroll inside the phone · Click cards to explore · Sample data only</footer><script>const phone=document.querySelector('.phone'),wrap=document.querySelector('.phone-wrap'),stage=document.querySelector('.stage'),frame=document.querySelector('iframe');function fit(){const s=Math.min(1,(stage.clientHeight-24)/852,(innerWidth-24)/410);phone.style.transform='scale('+s+')';wrap.style.width=410*s+'px';wrap.style.height=852*s+'px'}addEventListener('resize',fit);fit();document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-route]').forEach(x=>x.classList.toggle('active',x===b));frame.src='/#'+b.dataset.route});</script></body></html>
